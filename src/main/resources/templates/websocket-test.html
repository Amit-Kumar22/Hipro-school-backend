<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Test</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <style>
    body { font-family: monospace; margin: 20px; }
    #log { background: #1e1e1e; color: #d4d4d4; padding: 10px; height: 400px; overflow-y: auto; }
    .sent { color: #569cd6; }
    .received { color: #4ec9b0; }
    .error { color: #f44747; }
    .info { color: #dcdcaa; }
    input, button, select { margin: 5px; padding: 8px; }
  </style>
</head>
<body>
  <h2>WebSocket STOMP Test</h2>
  
  <div>
    <label>JWT Token:</label><br>
    <input type="text" id="token" style="width:600px" placeholder="Paste your JWT token here">
  </div>
  
  <div>
    <label>Server:</label>
    <input type="text" id="server" value="http://localhost:7979/api">
  </div>
  
  <div>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <span id="status">Disconnected</span>
  </div>
  
  <hr>
  
  <div>
    <label>Conversation ID:</label>
    <input type="number" id="convId" value="1">
  </div>
  
  <div>
    <label>Message:</label>
    <input type="text" id="message" style="width:400px" placeholder="Type a message">
    <button onclick="sendMessage()">Send Message</button>
  </div>
  
  <div>
    <button onclick="sendTyping(true)">Start Typing</button>
    <button onclick="sendTyping(false)">Stop Typing</button>
  </div>
  
  <div>
    <label>Last Message ID for Read Receipt:</label>
    <input type="number" id="lastMsgId" value="1">
    <button onclick="sendReadReceipt()">Send Read Receipt</button>
  </div>
  
  <hr>
  
  <h3>Log:</h3>
  <div id="log"></div>

  <script>
    let stompClient = null;
    let subscriptions = [];

    function log(msg, type = 'info') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connect() {
      const token = document.getElementById('token').value;
      const server = document.getElementById('server').value;
      
      if (!token) {
        log('Please enter a JWT token', 'error');
        return;
      }

      const socket = new SockJS(server + '/ws');
      stompClient = Stomp.over(socket);
      stompClient.debug = null; // Disable debug logging

      stompClient.connect(
        { Authorization: 'Bearer ' + token },
        function (frame) {
          document.getElementById('status').innerText = 'Connected';
          document.getElementById('status').style.color = 'green';
          log('Connected to WebSocket', 'info');
          subscribeToConversation();
        },
        function (error) {
          document.getElementById('status').innerText = 'Disconnected';
          document.getElementById('status').style.color = 'red';
          log('Connection error: ' + error, 'error');
        }
      );
    }

    function disconnect() {
      if (stompClient) {
        stompClient.disconnect();
        document.getElementById('status').innerText = 'Disconnected';
        document.getElementById('status').style.color = 'red';
        log('Disconnected', 'info');
      }
    }

    function subscribeToConversation() {
      const convId = document.getElementById('convId').value;
      
      // Unsubscribe old ones
      subscriptions.forEach(sub => sub.unsubscribe());
      subscriptions = [];

      // Subscribe to messages
      const msgSub = stompClient.subscribe('/topic/conversation/' + convId, function (message) {
        const msg = JSON.parse(message.body);
        log(`MESSAGE from ${msg.senderName}: ${msg.content} [${msg.status}]`, 'received');
      });
      subscriptions.push(msgSub);

      // Subscribe to typing
      const typingSub = stompClient.subscribe('/topic/conversation/' + convId + '/typing', function (message) {
        const data = JSON.parse(message.body);
        log(`TYPING: ${data.userName} is ${data.typing ? 'typing...' : 'stopped typing'}`, 'info');
      });
      subscriptions.push(typingSub);

      // Subscribe to read receipts
      const readSub = stompClient.subscribe('/topic/conversation/' + convId + '/read', function (message) {
        const data = JSON.parse(message.body);
        log(`READ RECEIPT: ${data.userName} read up to message ${data.lastReadMessageId}`, 'info');
      });
      subscriptions.push(readSub);

      log('Subscribed to conversation ' + convId, 'info');
    }

    function sendMessage() {
      const convId = document.getElementById('convId').value;
      const content = document.getElementById('message').value;
      
      if (!content) return;
      
      stompClient.send('/app/chat.send', {}, JSON.stringify({
        conversationId: parseInt(convId),
        content: content
      }));
      
      log('SENT: ' + content, 'sent');
      document.getElementById('message').value = '';
    }

    function sendTyping(isTyping) {
      const convId = document.getElementById('convId').value;
      stompClient.send('/app/chat.typing/' + convId, {}, JSON.stringify({
        typing: isTyping
      }));
      log('SENT typing: ' + isTyping, 'sent');
    }

    function sendReadReceipt() {
      const convId = document.getElementById('convId').value;
      const lastMsgId = document.getElementById('lastMsgId').value;
      stompClient.send('/app/chat.read', {}, JSON.stringify({
        conversationId: parseInt(convId),
        lastMessageId: parseInt(lastMsgId)
      }));
      log('SENT read receipt for message ' + lastMsgId, 'sent');
    }

    // Send message on Enter key
    document.getElementById('message').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
