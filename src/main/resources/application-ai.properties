# AI providers - register any number of providers under application.ai.providers.<name>
# protocol: openai (OpenAI-compatible /chat/completions) or anthropic (/v1/messages)
# api-key is optional for local/self-hosted models that need no auth (Ollama, LM Studio, llama.cpp)
# Optional per provider: max-tokens, connect-timeout-ms, read-timeout-ms, max-attempts,
#                        extra-headers.<name>=<value>  (for gateways needing custom headers)
# Per-request override: pass "provider":"<name>" in the AI query request body
application.ai.default-provider=xkiro
application.ai.summary-enabled=true

application.ai.providers.openai.protocol=openai
application.ai.providers.openai.base-url=https://api.openai.com/v1
application.ai.providers.openai.api-key=${OPENAI_API_KEY:}
application.ai.providers.openai.model=gpt-4o-mini

application.ai.providers.gemini.protocol=openai
application.ai.providers.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
application.ai.providers.gemini.api-key=${GEMINI_API_KEY:}
application.ai.providers.gemini.model=gemini-2.0-flash

application.ai.providers.anthropic.protocol=anthropic
application.ai.providers.anthropic.base-url=https://api.anthropic.com
application.ai.providers.anthropic.api-key=${ANTHROPIC_API_KEY:}
application.ai.providers.anthropic.model=claude-3-5-haiku-latest

