application.ai.providers.openrouter.base-url=https://openrouter.ai/api/v1
application.ai.providers.openrouter.api-key=${OPENROUTER_API_KEY:}
application.ai.providers.openrouter.model=openrouter/free
#
application.ai.providers.deepseek.protocol=openai
application.ai.providers.deepseek.base-url=https://api.deepseek.com/v1
application.ai.providers.deepseek.api-key=${DEEPSEEK_API_KEY:}
application.ai.providers.deepseek.model=deepseek-chat

application.ai.providers.xkiro.protocol=openai
application.ai.providers.xkiro.base-url=https://api.xkiro.com/v1
application.ai.providers.xkiro.api-key=${XKIRO_API_KEY:}
application.ai.providers.xkiro.model=qwen/qwen3.8-omni-flash:free

# AI Search (natural language to SQL) configuration
application.ai.search.enabled=true
application.ai.search.max-rows=1000
application.ai.search.query-timeout-seconds=30
application.ai.search.max-sql-length=10000
# Comma-separated list of tables the AI search can query. Empty = allow all non-system tables.
application.ai.search.approved-tables=\
  user,\
  students,\
  teachers,\
  classes,\
  subjects,\
  periods,\
  weekly_timetables,\
  class_subjects,\
  teacher_subject_section,\
  student_class_section,\
  student_fee,\
  fee_structure,\
  student_concessions,\
  payments,\
  payment_details,\
  attendance,\
  exams,\
  exam_subjects,\
  exam_results,\
  test_exam,\
  exam_sections,\
  exam_questions,\
  questions,\
  question_options,\
  student_exams,\
  student_answers,\
  staff_salaries,\
  staff_salary_templates,\
  staff_access_controls,\
  access_attribute,\
  access_permission,\
  student_leaves,\
  homework,\
  homework_notes,\
  holidays,\
  notice_boards,\
  announcements,\
  documents,\
  schools,\
  chat_room,\
  chat_room_member,\
  chat_message,\
  conversations,\
  conversation_members,\
  messages,\
  chat_bot,\
  leads,\
  audit_log,\
  employee_devices
# Columns that must never be returned in AI search results
application.ai.search.denied-columns=password,otp,raw_password,bank_response,refund_details,razorpay_order_id,transaction_id
