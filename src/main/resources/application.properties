# Set active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:7979}

spring.application.name=hipro-school-backend
spring.main.lazy-initialization=true
server.servlet.context-path=/api

##File Upload
#origin.url=http://62.72.57.219:3000/
#rewardPoints=20
#file.upload-dir=/opt/upload-files/
#file.public-url=http://62.72.57.219/uploads/

#Timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.date-format=dd MMMM yyyy HH:mm
server.address=0.0.0.0
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=1000MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
spring.devtools.restart.enabled=false


# JWT Config
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Sales target
sales.targetMonthly=1000000

# Resilience4j Rate Limiter Configuration
resilience4j.ratelimiter.instances.customerBookingRateLimiter.limit-for-period=1
resilience4j.ratelimiter.instances.customerBookingRateLimiter.limit-refresh-period=2m
resilience4j.ratelimiter.instances.customerBookingRateLimiter.timeout-duration=0

# Redis server configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000
spring.cache.redis.time-to-live=86400000
spring.cache.redis.cache-null-values=false
spring.cache.type=redis
logging.level.org.springframework.data.redis.repository.support=WARN


# AI configuration is loaded from application-ai.properties
spring.config.import=classpath:application-ai.properties,optional:file:.env[.properties]

# Enable Redis as cache provider
api.documentation.url=${API_DOCS_URL:http://localhost:7979/api/v3/api-docs}
api.documentation.output=docs
