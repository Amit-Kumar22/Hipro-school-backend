# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Mail
application.mail.host=${MAIL_HOST:smtp.hostinger.com}
application.mail.port=${MAIL_PORT:465}
application.mail.username=${MAIL_USERNAME}
application.mail.password=${MAIL_PASSWORD}
application.mail.properties.mail.smtp.auth=true
application.mail.properties.mail.smtp.starttls.enable=true
application.mail.properties.mail.smtp.starttls.required=true

#file upload related config
origin.url=${ORIGIN_URL:}
rewardPoints=20
file.upload-dir=${FILE_UPLOAD_DIR:/opt/upload-files/}
file.public-url=${FILE_PUBLIC_URL:}
